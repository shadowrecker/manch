name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Pinned to 24.04: ubuntu-latest is now 26.04, which Playwright 1.48 can't
  # install Chromium on. Move back to ubuntu-latest after upgrading Playwright.
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit + route + component tests (coverage)
        run: npm run test:coverage
        # AI golden evals run only when ANTHROPIC_API_KEY is present (skipped otherwise).
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
      - name: E2E (public surface)
        run: npx playwright test
